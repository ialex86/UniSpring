# UniSpring logging levels and sink routing.
# Levels: Debug, Info, Warn, Error, None.
#
# All registered ILogSink implementations are active by default. Uncomment a
# sinks line to narrow the set, or add sinks.<source> to route one source.
root = Info
BasicSetup = Debug

